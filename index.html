<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcast Wiki — 大仁來開槓 ＋ 股癌</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root {
    --bg: #fafaf7; --card: #ffffff; --border: #e4e4dc; --text: #2c2c2c;
    --muted: #8a8a7a; --accent: #2f6b3a; --accent-soft: #eef5ef; --hl: #fff3a8;
    --goo: #b8651e; --goo-soft: #fbf0e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "PingFang TC", "Microsoft JhengHei",
      "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text);
    line-height: 1.7;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--card);
    border-bottom: 1px solid var(--border); padding: 18px 20px 14px;
    box-shadow: 0 1px 8px rgba(0,0,0,.03);
  }
  header h1 { margin: 0 0 12px; font-size: 20px; color: var(--accent); }
  /* 頻道頁籤 */
  .tabs { max-width: 860px; margin: 0 auto 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    font-family: inherit; font-size: 14px; padding: 6px 16px; cursor: pointer;
    border: 1px solid var(--border); border-radius: 999px; background: var(--card);
    color: var(--muted); transition: all .15s;
  }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active {
    background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600;
  }
  .tab[data-ch="gooaye"].active { background: var(--goo); border-color: var(--goo); }
  .search-wrap { max-width: 860px; margin: 0 auto; position: relative; }
  .search-wrap input {
    width: 100%; padding: 12px 16px 12px 42px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
    font-family: inherit;
  }
  .search-wrap input:focus { outline: none; border-color: var(--accent); }
  .search-wrap::before {
    content: "🔍"; position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%); font-size: 16px; opacity: .6;
  }
  .meta-bar {
    max-width: 860px; margin: 8px auto 0; font-size: 13px; color: var(--muted);
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  .meta-bar select {
    font-family: inherit; font-size: 13px; border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 8px; background: var(--card);
  }
  main { max-width: 860px; margin: 0 auto; padding: 20px; }

  .ep-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 14px; overflow: hidden; transition: box-shadow .15s;
  }
  .ep-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  .ep-card[data-ch="gooaye"] { border-left: 3px solid var(--goo); }
  .ep-head {
    padding: 16px 18px; cursor: pointer; display: flex; gap: 14px; align-items: flex-start;
  }
  .ep-badge {
    flex-shrink: 0; min-width: 52px; height: 28px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent); font-weight: 700;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
  }
  .ep-card[data-ch="gooaye"] .ep-badge { background: var(--goo-soft); color: var(--goo); }
  .ep-info { flex: 1; min-width: 0; }
  .ep-title { font-size: 16px; font-weight: 600; margin: 0 0 4px; line-height: 1.4; }
  .ep-date { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .ep-summary {
    font-size: 14px; color: #555; margin: 0; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .snippets { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; }
  .snippet {
    font-size: 13.5px; color: #555; line-height: 1.6; padding: 8px 12px;
    background: var(--bg); border-left: 2px solid var(--border);
    border-radius: 0 6px 6px 0; word-break: break-word;
  }
  .ep-arrow {
    flex-shrink: 0; color: var(--muted); font-size: 13px; padding-top: 4px;
    transition: transform .2s;
  }
  .ep-card.open .ep-arrow { transform: rotate(90deg); }

  /* 標的 tag badges（股癌） */
  .tag-row { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 12px; padding: 2px 9px; border-radius: 999px; cursor: pointer;
    background: var(--goo-soft); color: var(--goo); border: 1px solid #f0d9c4;
    transition: all .12s; user-select: none;
  }
  .tag:hover { background: var(--goo); color: #fff; }

  .ep-body {
    display: none; padding: 0 18px 18px; border-top: 1px solid var(--border);
    margin-top: 0;
  }
  .ep-card.open .ep-body { display: block; animation: fade .15s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .ep-body h1 { font-size: 20px; margin: 16px 0 10px; }
  .ep-body h2 {
    font-size: 17px; margin: 22px 0 10px; padding-bottom: 4px;
    border-bottom: 1px solid var(--border); color: var(--accent);
  }
  .ep-card[data-ch="gooaye"] .ep-body h2 { color: var(--goo); }
  .ep-body h3 { font-size: 15px; margin: 18px 0 8px; }
  .ep-body p { margin: 8px 0; }
  .ep-body ul, .ep-body ol { padding-left: 22px; margin: 8px 0; }
  .ep-body li { margin: 4px 0; }
  .ep-body blockquote {
    margin: 10px 0; padding: 8px 14px; background: var(--accent-soft);
    border-left: 3px solid var(--accent); color: #444; border-radius: 0 6px 6px 0;
  }
  .ep-body table {
    border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px;
  }
  .ep-body th, .ep-body td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .ep-body th { background: var(--accent-soft); }
  .ep-body strong { color: var(--text); }
  mark { background: var(--hl); color: inherit; padding: 0 2px; border-radius: 2px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 15px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 30px 20px 40px; }
</style>
</head>
<body>
<header>
  <h1>🎙️ Podcast Wiki</h1>
  <div class="tabs" id="tabs">
    <button class="tab active" data-ch="all">全部</button>
    <button class="tab" data-ch="dareng">🎧 大仁來開槓</button>
    <button class="tab" data-ch="gooaye">📈 股癌</button>
  </div>
  <div class="search-wrap">
    <input id="search" type="text" placeholder="搜尋關鍵字（標題、日期、全文、標的…）" autocomplete="off">
  </div>
  <div class="meta-bar">
    <span id="count">載入中…</span>
    <span>排序：</span>
    <select id="sort">
      <option value="ep-desc">最新集數 ↓</option>
      <option value="ep-asc">最早集數 ↑</option>
      <option value="date-desc">日期新→舊</option>
      <option value="date-asc">日期舊→新</option>
    </select>
  </div>
</header>
<main id="list"></main>
<footer>共 <span id="total">0</span> 集 · 點擊卡片展開全文 · 點擊標的 tag 可直接搜尋該標的 · 全文搜尋在瀏覽器端執行</footer>

<script>
let EPS = [];
let activeChannel = 'all';   // 當前選中的頻道頁籤
const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
const sortEl = document.getElementById('sort');
const countEl = document.getElementById('count');
const totalEl = document.getElementById('total');
const tabsEl = document.getElementById('tabs');

function escapeHtml(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// 在純文字（已去掉 markdown 語法）上做命中高亮，避免破壞 HTML
function highlight(text, q){
  if(!q) return escapeHtml(text);
  const esc = escapeHtml(text);
  const ql = q.toLowerCase();
  // 在 HTML-escaped 字串上做大小寫不敏感取代
  return esc.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'),
    m => `<mark>${m}</mark>`);
}

function plainText(md){
  return md
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/^>\s?/gm, '')
    .replace(/^\s*[-*+]\s+/gm, '')
    .replace(/\n{2,}/g, '\n').trim();
}

// 全文裡找出所有命中位置，各截前後文（最多 limit 段），供搜尋結果預覽
function findSnippets(md, q, limit = 4){
  const txt = plainText(md);
  const ql = q.toLowerCase();
  const RADIUS = 60;  // 命中詞前後各取的字元數
  const out = [];
  let idx = 0;
  while(out.length < limit){
    const at = txt.toLowerCase().indexOf(ql, idx);
    if(at === -1) break;
    let from = Math.max(0, at - RADIUS);
    let to = Math.min(txt.length, at + q.length + RADIUS);
    let snip = txt.slice(from, to);
    if(from > 0) snip = '…' + snip;
    if(to < txt.length) snip = snip + '…';
    out.push(snip);
    idx = at + q.length;
  }
  return out;
}

function renderCard(ep, q){
  const tHit = highlight(ep.title, q);
  const card = document.createElement('div');
  card.className = 'ep-card';
  card.dataset.ch = ep.channel;
  // 搜尋時：用命中片段取代預設摘要；沒搜尋時顯示原摘要
  let previewHtml;
  if(q){
    const snips = findSnippets(ep.body, q, 4);
    if(snips.length){
      // 標題也命中時算進次數太複雜，這裡只標全文命中數
      previewHtml = `<div class="snippets">` +
        snips.map(s => `<div class="snippet">${highlight(s, q)}</div>`).join('') +
        `</div>`;
    } else {
      // 標題/日期/tag 命中但全文沒命中，顯示原摘要
      previewHtml = `<p class="ep-summary">${highlight(ep.summary, q)}</p>`;
    }
  } else {
    previewHtml = `<p class="ep-summary">${escapeHtml(ep.summary)}</p>`;
  }
  // 標的 tag badges（股癌才有；大仁 tags 為空陣列）
  let tagHtml = '';
  if(ep.tags && ep.tags.length){
    tagHtml = `<div class="tag-row">` +
      ep.tags.map(t => `<span class="tag" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join('') +
      `</div>`;
  }
  card.innerHTML = `
    <div class="ep-head">
      <div class="ep-badge">EP.${ep.ep}</div>
      <div class="ep-info">
        <h3 class="ep-title">${tHit}</h3>
        <div class="ep-date">📅 ${ep.date || '日期未知'}</div>
        ${previewHtml}
        ${tagHtml}
      </div>
      <div class="ep-arrow">▶</div>
    </div>
    <div class="ep-body"></div>`;
  const head = card.querySelector('.ep-head');
  const body = card.querySelector('.ep-body');
  let rendered = false;
  head.addEventListener('click', () => {
    const open = card.classList.toggle('open');
    if(open && !rendered){
      // marked 渲染全文
      body.innerHTML = marked.parse(ep.body);
      rendered = true;
      // 若有搜尋詞：高亮所有命中 + 捲到第一個命中處
      if(q){
        const first = highlightAll(body, q);
        if(first){
          // 等下一 frame 確保佈局完成再捲動，置中顯示
          requestAnimationFrame(() => first.scrollIntoView({ behavior: 'smooth', block: 'center' }));
        }
      }
    }
  });
  // 點 tag badge → 直接搜尋該標的
  card.querySelectorAll('.tag').forEach(t => {
    t.addEventListener('click', e => {
      e.stopPropagation();  // 避免觸發卡片展開
      const tag = t.dataset.tag;
      searchEl.value = tag;
      // 切到「全部」頻道以看到跨頻道的同名命中（若已在全部則維持）
      if(activeChannel !== 'all'){
        activeChannel = 'all';
        document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.ch === 'all'));
      }
      render();
      searchEl.focus();
    });
  });
  return card;
}

// 在已渲染 DOM 的所有文字節點上標記全部命中，回傳第一個 <mark> 元素（用於捲動）
function highlightAll(root, q){
  const ql = q.toLowerCase();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  let n; while(n = walker.nextNode()) nodes.push(n);
  let firstMark = null;
  nodes.forEach(node => {
    const txt = node.nodeValue;
    if(!txt.toLowerCase().includes(ql)) return;
    // 把整段文字依命中位置切成 多段，全部標記
    const frag = document.createDocumentFragment();
    let cursor = 0;
    let at = txt.toLowerCase().indexOf(ql, cursor);
    while(at !== -1){
      if(at > cursor) frag.appendChild(document.createTextNode(txt.slice(cursor, at)));
      const mk = document.createElement('mark');
      mk.textContent = txt.slice(at, at + q.length);
      frag.appendChild(mk);
      if(!firstMark) firstMark = mk;
      cursor = at + q.length;
      at = txt.toLowerCase().indexOf(ql, cursor);
    }
    if(cursor < txt.length) frag.appendChild(document.createTextNode(txt.slice(cursor)));
    node.parentNode.replaceChild(frag, node);
  });
  return firstMark;
}

function getSorter(){
  const v = sortEl.value;
  return (a,b) => {
    if(v === 'ep-desc') return b.ep - a.ep;
    if(v === 'ep-asc')  return a.ep - b.ep;
    if(v === 'date-desc') return (b.date||'').localeCompare(a.date||'');
    if(v === 'date-asc')  return (a.date||'').localeCompare(b.date||'');
    return 0;
  };
}

function render(){
  const q = searchEl.value.trim();
  const ql = q.toLowerCase();
  const sorted = [...EPS].sort(getSorter());
  listEl.innerHTML = '';
  let shown = 0;
  const frag = document.createDocumentFragment();
  for(const ep of sorted){
    // 頻道頁籤篩選
    if(activeChannel !== 'all' && ep.channel !== activeChannel) continue;
    let hit = true;
    if(q){
      const tagBlob = (ep.tags || []).join(' ');
      const blob = (ep.title + ' ' + ep.date + ' ' + ep.summary + ' ' + tagBlob + ' ' + plainText(ep.body)).toLowerCase();
      hit = blob.includes(ql);
    }
    if(!hit) continue;
    frag.appendChild(renderCard(ep, q));
    shown++;
  }
  listEl.appendChild(frag);
  const chLabel = activeChannel === 'all' ? '' :
    (activeChannel === 'dareng' ? '大仁來開槓 ' : '股癌 ');
  countEl.textContent = q ? `搜尋「${q}」→ ${shown} 集命中` : `${chLabel}共 ${shown} 集`;
  if(shown === 0){
    listEl.innerHTML = `<div class="empty">沒有找到符合「${escapeHtml(q)}」的內容</div>`;
  }
}

// 載入資料
fetch('episodes.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    EPS = data;
    totalEl.textContent = EPS.length;
    render();
  })
  .catch(err => {
    listEl.innerHTML = `<div class="empty">載入失敗：${err}<br>請用 <code>python3 -m http.server</code> 在 wiki/ 目錄下啟動</div>`;
  });

searchEl.addEventListener('input', render);
sortEl.addEventListener('change', render);

// 頻道頁籤切換
tabsEl.addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if(!btn) return;
  activeChannel = btn.dataset.ch;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

// 鍵盤捷徑：/ 聚焦搜尋框
document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== searchEl){
    e.preventDefault(); searchEl.focus();
  }
});
</script>
</body>
</html>
